name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Rebuild the runtime library for compiled programs
        run: scripts/build-runtime.sh

      - name: Test (native; compiled programs run under wasmtime)
        run: cargo test
        env:
          CHUK_BASIC_REQUIRE_WASMTIME: "1"

      - name: Test (WASI, inside wasmtime)
        run: cargo test --target wasm32-wasip1

      - name: Native and WASI builds print the same thing
        run: scripts/wasi-check.sh

      - name: Browser playground (the WASI shim and session logic, in node)
        run: |
          cargo build --release
          web/build.sh
          node web/test.mjs

      - name: VS Code extension (the grammar, tokenised in node)
        working-directory: editors/vscode
        run: |
          npm ci
          npm test
