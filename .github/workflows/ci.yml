name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Rebuild the runtime library for compiled programs
        run: scripts/build-runtime.sh

      - name: Test (native; compiled programs run under wasmtime)
        run: cargo test
        env:
          CHUK_BASIC_REQUIRE_WASMTIME: "1"

      - name: Test (WASI, inside wasmtime)
        run: cargo test --target wasm32-wasip1

      - name: Native and WASI builds print the same thing
        run: scripts/wasi-check.sh

      - name: Browser playground (the WASI shim and session logic, in node)
        run: |
          cargo build --release
          web/build.sh
          node web/test.mjs

      - name: VS Code extension (the grammar, and the interpreter and language server it carries, in node)
        working-directory: editors/vscode
        run: |
          npm ci
          npm run build
          npm test

  # The interpreter's own tests, and the extension in a real VS Code, on the
  # three systems people use.
  editor:
    name: VS Code extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the interpreter and language server (native)
        run: cargo test

      - name: Build the extension and run its node tests
        working-directory: editors/vscode
        run: |
          npm ci
          npm run build
          npm test

      - name: Run the extension in a real VS Code (Linux, on a virtual screen)
        if: runner.os == 'Linux'
        working-directory: editors/vscode
        run: xvfb-run -a npm run test:vscode

      - name: "Windows: the carried interpreter, run by VS Code's own program outside VS Code"
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: editors/vscode
        shell: bash
        run: |
          npx --yes @vscode/test-electron --version >/dev/null 2>&1 || true
          node -e "require('@vscode/test-electron').downloadAndUnzipVSCode().then(p => console.log(p))" | tail -1 > code-path.txt
          cat code-path.txt
          ELECTRON_RUN_AS_NODE=1 timeout 60 "$(cat code-path.txt)" server/run.js ../../samples/dartmouth/example1.bas; echo "exit status $?"

      - name: "Windows: Run Program with a native chuk-basic"
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: editors/vscode
        shell: bash
        run: |
          cargo build --release
          CHUK_BASIC="$(cd ../.. && pwd -W)/target/release/chuk-basic.exe" npm run test:vscode

      - name: Run the extension in a real VS Code
        if: runner.os != 'Linux'
        working-directory: editors/vscode
        run: npm run test:vscode
