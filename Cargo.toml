[package]
name = "chuk-basic"
version = "0.1.1"
edition = "2021"
description = "A BASIC interpreter (Dartmouth / Vintage / Microsoft flavours) that runs natively or as WebAssembly + WASI"
license = "MIT"

[lib]
name = "chuk_basic"
path = "src/lib.rs"

[[bin]]
name = "chuk-basic"
path = "src/main.rs"

[features]
default = ["compiler", "editor"]
# `--compile`, which embeds the runtime library (250 KB). The browser
# playground is built without it.
compiler = []
# `--lsp`, `--check` and `--renumber`: what an editor uses. Left out of the
# browser playground too.
editor = []

[workspace]
members = ["runtime"]

[profile.release]
opt-level = 3
lto = true
strip = true
